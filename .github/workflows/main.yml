name: A workflow for SEM project

on:
  push:
  pull_request:
    branches:
      - develop

jobs:
  build:
    name: SEM Project
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: temurin

      - name: Start MySQL
        run: docker compose up -d mysql

      - name: Wait for MySQL
        env:
          MYSQL_PWD: MyRootPassword2026!
        run: |
          for attempt in {1..60}; do
            if docker compose exec -T -e MYSQL_PWD="$MYSQL_PWD" mysql \
              mysql -u root -e "SELECT 1;" > /dev/null 2>&1; then
              echo "MySQL is ready"
              exit 0
            fi
            sleep 2
          done
          docker compose logs mysql
          exit 1

      - name: Import world database
        env:
          MYSQL_PWD: MyRootPassword2026!
        run: |
          docker compose exec -T -e MYSQL_PWD="$MYSQL_PWD" mysql \
            mysql -u root < src/main/java/org/example/db/world.sql

          docker compose exec -T -e MYSQL_PWD="$MYSQL_PWD" mysql \
            mysql -u root -e \
            "GRANT SELECT ON world.* TO 'software_app'@'%';"

      - name: Run tests and build JAR
        run: mvn --batch-mode clean package

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: target/surefire-reports/
          if-no-files-found: ignore

      - name: Upload JAR
        uses: actions/upload-artifact@v4
        with:
          name: application-jar
          path: target/*.jar

      - name: Build Docker Image
        run: docker build -t devopsimage .

      - name: Run application
        run: docker run --rm --network host devopsimage

      - name: Stop MySQL
        if: always()
        run: docker compose down