name: Publish GitHub Release

on:
  push:
    tags:
      - 'v*'

jobs:
  publish:
    if: github.event.created
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Publish release if the commit is on release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          release_branch=$(git rev-parse --verify refs/remotes/origin/release)
          if git merge-base --is-ancestor HEAD "$release_branch"; then
            gh release create "$GITHUB_REF_NAME" --verify-tag --generate-notes
          else
            echo "Skipping: $GITHUB_REF_NAME is not in the release branch history."
          fi
